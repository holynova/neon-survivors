<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">NEON SURVIVORS — 霓虹幸存者：3D 俯视角弹幕肉鸽</title>
  <desc id="desc">深蓝底标题：NEON SURVIVORS 霓虹幸存者；右侧是俯视角霓虹竞技场网格，中央青色玩家菱形向四周发射弹丸，粉色敌怪从边缘逼近。</desc>

  <rect width="1200" height="360" rx="26" fill="#080a18"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#00f3ff">3D SURVIVORS-LIKE ROGUELITE</text>
    <text x="56" y="128" font-size="54" font-weight="700" fill="#f2f7ff">NEON SURVIVORS</text>
    <text x="56" y="168" font-size="23" fill="#c8d6f0">霓虹幸存者 — 浏览器里的 3D 俯视角弹幕肉鸽</text>
    <text x="56" y="204" font-size="19" fill="#8fa3c8">零外部资源：模型程序化生成，音效实时合成。</text>
    <g id="chips" font-size="18" fill="#c8d6f0" text-anchor="middle">
      <g><rect x="56" y="238" width="112" height="36" rx="18" fill="#101830" stroke="#24345c" stroke-width="1.5"/><text x="112" y="262">5 角色</text></g>
      <g><rect x="180" y="238" width="182" height="36" rx="18" fill="#101830" stroke="#24345c" stroke-width="1.5"/><text x="271" y="262">8 武器 · 超武进化</text></g>
      <g><rect x="374" y="238" width="168" height="36" rx="18" fill="#101830" stroke="#24345c" stroke-width="1.5"/><text x="458" y="262">20 波 · 3 泰坦</text></g>
      <g><rect x="554" y="238" width="154" height="36" rx="18" fill="#101830" stroke="#24345c" stroke-width="1.5"/><text x="631" y="262">116 单元测试</text></g>
    </g>
  </g>

